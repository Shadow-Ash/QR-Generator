<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="description" content="Shadow Ash QR Generator - Generate permanent static QR codes." />

    <title>Shadow Ash QR Generator</title>

    <style>
        :root {
            --bg: #f4f4f5;
            --card: #ffffff;
            --text: #111111;
            --muted: #71717a;
            --border: #e4e4e7;
            --input: #fafafa;
            --button: #111111;
            --button-text: #ffffff;
            --secondary: #f4f4f5;
            --shadow: rgba(0, 0, 0, 0.08);
        }

        body.dark {
            --bg: #09090b;
            --card: #111113;
            --text: #f4f4f5;
            --muted: #a1a1aa;
            --border: #27272a;
            --input: #18181b;
            --button: #f4f4f5;
            --button-text: #09090b;
            --secondary: #18181b;
            --shadow: rgba(0, 0, 0, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background: var(--bg);
            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            transition:
                background 0.25s ease,
                color 0.25s ease;
        }

        .app {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 32px 20px;
        }

        .wrapper {
            width: 100%;
            max-width: 620px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: var(--button);
            color: var(--button-text);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 15px;
            font-weight: 800;

            letter-spacing: -0.04em;
        }

        .brand-name {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .brand-subtitle {
            margin-top: 2px;

            font-size: 12px;
            color: var(--muted);
        }

        .theme-button {
            width: 42px;
            height: 42px;

            border: 1px solid var(--border);
            border-radius: 12px;

            background: var(--card);
            color: var(--text);

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;

            transition: 0.2s ease;
        }

        .theme-button:hover {
            transform: translateY(-1px);
        }

        .card {
            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 18px 50px var(--shadow);

            transition:
                background 0.25s ease,
                border 0.25s ease;
        }

        h1 {
            margin: 0;

            font-size: clamp(28px, 5vw, 38px);

            line-height: 1.05;

            letter-spacing: -0.045em;
        }

        .description {
            margin: 10px 0 28px;

            color: var(--muted);

            line-height: 1.6;

            font-size: 14px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border-radius: 12px;

            border: 1px solid var(--border);

            background: var(--input);
            color: var(--text);

            outline: none;

            font-size: 14px;

            transition: 0.2s ease;
        }

        input:focus {
            border-color: var(--text);
        }

        .options {
            display: flex;
            flex-wrap: wrap;

            gap: 10px;

            margin-bottom: 24px;
        }

        .option {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 10px 13px;

            border-radius: 10px;

            background: var(--secondary);

            border: 1px solid var(--border);

            font-size: 13px;

            cursor: pointer;
        }

        .option input {
            width: auto;
            height: auto;

            margin: 0;
        }

        .preview {
            min-height: 280px;

            border: 1px dashed var(--border);

            border-radius: 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-bottom: 20px;

            overflow: hidden;

            background-image:
                linear-gradient(45deg, #eeeeee 25%, transparent 25%),
                linear-gradient(-45deg, #eeeeee 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #eeeeee 75%),
                linear-gradient(-45deg, transparent 75%, #eeeeee 75%);

            background-size: 20px 20px;

            background-position:
                0 0,
                0 10px,
                10px -10px,
                -10px 0px;
        }

        body.dark .preview {
            background-image:
                linear-gradient(45deg, #202024 25%, transparent 25%),
                linear-gradient(-45deg, #202024 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #202024 75%),
                linear-gradient(-45deg, transparent 75%, #202024 75%);
        }

        #qrPreview {
            max-width: 80%;
            max-height: 280px;

            display: none;
        }

        .preview-placeholder {
            color: var(--muted);
            font-size: 13px;
        }

        .buttons {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        button.download {
            height: 50px;

            border: 0;

            border-radius: 12px;

            background: var(--button);
            color: var(--button-text);

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                opacity 0.2s ease;
        }

        button.download:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        button.download:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            color: var(--muted);

            font-size: 13px;
        }

        .footer {
            text-align: center;

            margin-top: 18px;

            color: var(--muted);

            font-size: 11px;
        }

        @media (max-width: 560px) {

            .card {
                padding: 22px;
                border-radius: 18px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .preview {
                min-height: 240px;
            }

        }
    </style>
</head>


<body>

    <div class="app">

        <div class="wrapper">

            <header class="header">

                <div class="brand">

                    <div class="brand-mark">
                        SA
                    </div>

                    <div>

                        <div class="brand-name">
                            Shadow Ash
                        </div>

                        <div class="brand-subtitle">
                            QR Generator
                        </div>

                    </div>

                </div>


                <button id="themeButton" class="theme-button" aria-label="Toggle theme">
                    ☾
                </button>

            </header>

            <main class="card">

                <h1>
                    Static QR Generator
                </h1>

                <p class="description">
                    Generate permanent static QR codes for links,
                    cards, posters and print designs.
                </p>

                <div class="field">

                    <label for="url">
                        Destination URL
                    </label>

                    <input id="url" type="url" placeholder="https://example.com" autocomplete="off" />

                </div>

                <div class="options">

                    <label class="option">

                        <input id="transparent" type="checkbox" />

                        Transparent background

                    </label>

                </div>

                <div class="preview">

                    <div id="placeholder" class="preview-placeholder">
                        QR preview will appear here
                    </div>

                    <img id="qrPreview" alt="QR Code Preview" />

                </div>

                <div class="buttons">

                    <button id="pngButton" class="download" disabled>
                        Download PNG
                    </button>

                    <button id="svgButton" class="download" disabled>
                        Download SVG
                    </button>

                </div>


                <div id="status" class="status"></div>

            </main>


            <footer class="footer">

                Shadow Ash QR Generator · Static QR · No expiry

            </footer>

        </div>

    </div>


    <script>

        const urlInput =
            document.getElementById("url");

        const transparentInput =
            document.getElementById("transparent");

        const qrPreview =
            document.getElementById("qrPreview");

        const placeholder =
            document.getElementById("placeholder");

        const pngButton =
            document.getElementById("pngButton");

        const svgButton =
            document.getElementById("svgButton");

        const status =
            document.getElementById("status");

        const themeButton =
            document.getElementById("themeButton");

        const savedTheme =
            localStorage.getItem("shadow-ash-theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark");
            themeButton.textContent = "☀";
        }

        themeButton.addEventListener(
            "click",
            () => {

                document.body.classList.toggle("dark");

                const dark =
                    document.body.classList.contains("dark");

                themeButton.textContent =
                    dark ? "☀" : "☾";

                localStorage.setItem(
                    "shadow-ash-theme",
                    dark ? "dark" : "light"
                );

            }
        );

        function getValidURL() {

            const value =
                urlInput.value.trim();

            if (!value) {
                return null;
            }

            try {

                const parsed =
                    new URL(value);

                if (
                    parsed.protocol !== "http:" &&
                    parsed.protocol !== "https:"
                ) {
                    return null;
                }

                return parsed.toString();

            } catch {

                return null;

            }

        }

        let previewTimeout;

        async function updatePreview() {

            const url =
                getValidURL();

            if (!url) {

                qrPreview.style.display = "none";

                placeholder.style.display = "block";

                pngButton.disabled = true;

                svgButton.disabled = true;

                return;

            }

            clearTimeout(previewTimeout);

            previewTimeout =
                setTimeout(async () => {

                    try {

                        const response =
                            await fetch("/api/qr/png", {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({
                                    url,
                                    transparent:
                                        transparentInput.checked
                                })

                            });


                        if (!response.ok) {
                            throw new Error();
                        }


                        const blob =
                            await response.blob();

                        const imageURL =
                            URL.createObjectURL(blob);


                        qrPreview.src =
                            imageURL;

                        qrPreview.style.display =
                            "block";

                        placeholder.style.display =
                            "none";


                        pngButton.disabled =
                            false;

                        svgButton.disabled =
                            false;


                        status.textContent =
                            "Static QR ready.";

                    } catch {

                        qrPreview.style.display =
                            "none";

                        placeholder.style.display =
                            "block";

                        status.textContent =
                            "Unable to generate preview.";

                    }

                }, 250);

        }

        async function download(format) {

            const url =
                getValidURL();

            if (!url) {

                status.textContent =
                    "Enter a valid URL first.";

                urlInput.focus();

                return;

            }


            status.textContent =
                `Generating ${format.toUpperCase()}...`;


            try {

                const response =
                    await fetch(
                        `/api/qr/${format}`,
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                url,

                                transparent:
                                    transparentInput.checked

                            })

                        }
                    );


                if (!response.ok) {

                    const data =
                        await response.json();

                    throw new Error(
                        data.error ||
                        "Generation failed."
                    );

                }


                const blob =
                    await response.blob();


                const downloadURL =
                    URL.createObjectURL(blob);


                const link =
                    document.createElement("a");


                link.href =
                    downloadURL;


                link.download =
                    format === "png"
                        ? "shadow-ash-qr.png"
                        : "shadow-ash-qr.svg";


                document.body.appendChild(link);

                link.click();

                link.remove();


                setTimeout(() => {

                    URL.revokeObjectURL(
                        downloadURL
                    );

                }, 1000);


                status.textContent =
                    `${format.toUpperCase()} downloaded successfully.`;

            } catch (error) {

                console.error(error);

                status.textContent =
                    error.message ||
                    "Something went wrong.";

            }

        }

        urlInput.addEventListener(
            "input",
            updatePreview
        );

        transparentInput.addEventListener(
            "change",
            updatePreview
        );

        pngButton.addEventListener(
            "click",
            () => download("png")
        );

        svgButton.addEventListener(
            "click",
            () => download("svg")
        );


    </script>

</body>

</html>
